name: dual-paper

on:
  workflow_dispatch: # Triggered by cron-job.org or manually
  schedule:
    - cron: '*/15 * * * *' # Fallback cron run every 15 minutes

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Paper trade for ~1 minute
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
          KALSHI_EMAIL: ${{ secrets.KALSHI_EMAIL }}
          KALSHI_PASSWORD: ${{ secrets.KALSHI_PASSWORD }}
        run: |
          python okx_kalshi_dual_paper_v2.py --entry 0.90

      - name: Commit paper trading data and logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "paper data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

      - name: Generate Run Summary
        if: always()
        run: |
          echo "### Paper Trading Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f data/summary.md ]; then
            cat data/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No settled positions yet." >> $GITHUB_STEP_SUMMARY
          fi
